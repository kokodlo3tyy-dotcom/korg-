name: Build VST3 and Standalone

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KorgKMPEngine-Windows
          path: |
            build/KorgKMPEngine_artefacts/Release/VST3/Korg KMP Engine.vst3
            build/KorgKMPEngine_artefacts/Release/Standalone/Korg KMP Engine.exe
